name: Validar reglas Firestore de usuarios (solo emulador)
on:
  push:
    branches: [gula2-usuarios-firebase, ventas-firebase-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seguridad-membresias:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias locales de prueba
        run: npm install --no-audit --no-fund
      - name: Probar reglas en emulador (sin credenciales reales)
        run: npm run test:rules
