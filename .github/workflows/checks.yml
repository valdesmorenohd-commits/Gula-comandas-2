name: Validaciones Gula 2.0 (demostración)
on:
  push:
    branches: [gula2-desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar estructura y seguridad base
        run: node scripts/check-app.mjs
      - name: Probar matriz de permisos simulada
        run: node scripts/test-access-policy.mjs
