name: Verificar sintaxis de interfaz Gula
on:
  push:
    branches: [gula2-usuarios-firebase, ventas-firebase-mvp]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  interfaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar sintaxis módulo Firebase
        run: node --check src/firebase-members.mjs
      - name: Comprobar módulos de datos compartidos
        run: |
          node --check src/cloud-master-data.mjs
          node --check src/cloud-order-drafts.mjs
          node --check src/cloud-sales.mjs
          node --check src/cloud-workspace.mjs
          node --check src/cloud-backup.mjs
          node --check src/cloud-receipts.mjs
          node --check src/cloud-reports.mjs
          node --check src/cloud-report-loader.mjs
          node --check src/cloud-report-export.mjs
          node --check functions/index.mjs
          node --check functions/core.mjs
          node --check functions/access-policy.mjs
          node --check src/access-policy.mjs
      - name: Comprobar sintaxis de JS integrado en index
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);if(!m)throw Error('Script módulo ausente');fs.writeFileSync('/tmp/gula-index-module.mjs',m[1])"
          node --check /tmp/gula-index-module.mjs
