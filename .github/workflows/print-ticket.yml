name: Probar impresión individual Gula 58 mm
on:
  push:
    branches: [impresion-comanda-58mm]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recibo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar módulos de impresión
        run: |
          node --check src/cloud-receipts.mjs
          node --check src/receipt-print-adapter.mjs
          node --check src/test/receipt-print-adapter.test.mjs
      - name: Comprobar sintaxis de la interfaz
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script type=\"module\">([\s\S]*?)<\/script>/);if(!m)throw Error('Script módulo ausente');fs.writeFileSync('/tmp/gula-index-print.mjs',m[1])"
          node --check /tmp/gula-index-print.mjs
      - name: Probar ticket térmico 58 mm
        run: node --test src/test/receipt-print-adapter.test.mjs
